<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e9">
<meta name="description" content="Cat Care V2 貓咪照護管理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Cat Care V2｜貓咪照護</title>
</head>
<body>
<div class="app">
<header class="header">
  <div><div class="brand">🐾 CAT CARE</div><h1>今日照護</h1><p id="dateText"></p></div>
  <button id="settingsBtn" class="round">⚙️</button>
</header>

<section class="hero">
  <div><div class="hero-title">今日進度</div><div><b id="doneCount">0</b><span> / <span id="totalCount">0</span> 項完成</span></div>
  <div class="bar"><i id="progress"></i></div></div>
  <div class="percent" id="percent">0%</div>
</section>

<div class="quick">
  <button id="pendingBtn">未完成 <b id="pendingCount">0</b></button>
  <button id="allBtn" class="active">全部</button>
</div>

<section id="cats"></section>
<button id="addCat" class="add-main">＋ 新增貓咪</button>
<footer>每天 06:00 自動開始新的一天</footer>
</div>

<dialog id="catModal"><form id="catForm" class="modal">
  <div class="modal-head"><h2 id="catTitle">新增貓咪</h2><button type="button" class="round close">✕</button></div>
  <label>貓咪名稱<input id="catName" required maxlength="30" placeholder="例如：咪咪"></label>
  <label>備註<input id="catMemo" maxlength="100" placeholder="例如：最近需要多觀察喝水量"></label>
  <label>照片（可選）<input id="catPhoto" type="file" accept="image/*"></label>
  <img id="photoPreview" class="preview" hidden>
  <div class="actions"><button type="button" class="ghost close">取消</button><button class="dark">儲存</button></div>
</form></dialog>

<dialog id="careModal"><form id="careForm" class="modal">
  <div class="modal-head"><h2 id="careTitle">新增照護</h2><button type="button" class="round close">✕</button></div>
  <label>照護事項<select id="careType"></select></label>
  <label>時間<input id="careTime" type="time" required></label>
  <label>備註<input id="careMemo" maxlength="100" placeholder="例如：罐頭半罐、藥 1 顆"></label>
  <label class="switch-row"><span>重要照護</span><input id="careImportant" type="checkbox"></label>
  <div class="actions"><button type="button" class="ghost close">取消</button><button class="dark">儲存</button></div>
</form></dialog>

<dialog id="settingsModal"><div class="modal">
  <div class="modal-head"><h2>設定</h2><button type="button" class="round close">✕</button></div>
  <section><h3>照護事項選單</h3><p class="hint">這裡新增的項目會出現在所有貓咪的下拉選單。</p>
  <div id="options" class="chips"></div>
  <div class="add-option"><input id="newOption" maxlength="30" placeholder="例如：剪指甲"><button id="addOption" class="soft">新增</button></div></section>
  <section><h3>提醒通知</h3><p id="notifyStatus" class="hint"></p><button id="notify" class="soft">啟用瀏覽器提醒</button></section>
  <section><h3>資料</h3><button id="export" class="soft">匯出備份 JSON</button><label class="import-label">匯入備份 JSON<input id="import" type="file" accept="application/json"></label><button id="clear" class="danger">清除全部資料</button></section>
</div></dialog>
<script src="app.js"></script>
</body>
</html>
