<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf5"><meta name="description" content="貓咪每日照護與喝水紀錄">
<title>貓咪照護小幫手</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="topbar"><div><div class="eyebrow">CAT CARE</div><h1>貓咪照護</h1><div id="dateText" class="muted"></div></div><button id="notifyBtn" class="round">🔔</button></header>

<main>
<section id="page-today" class="page active">
  <div class="summary card"><div><span class="pill">今日照護</span><h2 id="progressTitle">準備開始</h2><p id="progressText" class="muted"></p></div><div id="ring" class="ring"><b id="pct">0%</b></div></div>
  <div class="section-title"><div><h2>我的貓咪</h2><p class="muted">勾選完成今天的照護事項</p></div><button id="addCat" class="primary">＋ 新增</button></div>
  <div id="cats" class="grid"></div>
</section>

<section id="page-water" class="page">
  <div class="section-title"><div><h2>💧 喝水紀錄</h2><p class="muted">歷史紀錄不會在 06:00 清除</p></div><button id="addWater" class="primary">＋ 記錄</button></div>
  <div id="waterSummary" class="water-summary card"></div>
  <div id="waterRecords" class="grid"></div>
</section>

<section id="page-settings" class="page">
  <div class="section-title"><div><h2>⚙️ 設定</h2><p class="muted">調整照護項目與提醒</p></div></div>
  <div class="card setting"><div><b>每日 09:00 提醒</b><p class="muted">瀏覽器允許通知後，頁面可執行時提醒。</p></div><label class="switch"><input id="reminder" type="checkbox"><span></span></label></div>
  <div class="card"><h3>照護選項</h3><p class="muted">新增後會出現在「新增照護事項」下拉選單。</p><div id="options"></div><div class="add-line"><input id="newOption" placeholder="例如：餵藥"><button id="addOption" class="secondary">新增</button></div></div>
  <div class="card"><h3>資料</h3><p class="muted">資料目前儲存在這台裝置的瀏覽器。</p><button id="exportData" class="secondary wide">匯出備份 JSON</button><label class="secondary wide file-label">匯入備份 JSON<input id="importData" type="file" accept=".json"></label></div>
</section>
</main>

<nav class="bottom-nav"><button data-page="today" class="nav active">🏠<span>今日</span></button><button data-page="water" class="nav">💧<span>喝水</span></button><button data-page="settings" class="nav">⚙️<span>設定</span></button></nav>
</div>

<dialog id="catDlg"><form id="catForm" class="dialog"><h2>新增貓咪</h2><label>貓咪照片
<div class="photo-picker">
  <div id="photoPreview" class="photo-preview">🐱</div>
  <div class="photo-picker-actions">
    <label class="secondary photo-button">選擇照片<input id="catPhoto" type="file" accept="image/*"></label>
    <button type="button" id="removePhoto" class="mini">移除照片</button>
  </div>
  <small class="muted">照片會縮小後儲存在此瀏覽器，不會上傳到 GitHub。</small>
</div>
</label><label>名字<input id="catName" required maxlength="30" placeholder="例如 Mimi"></label><label>備註<textarea id="catNote" maxlength="100" placeholder="例如：需要特別注意喝水"></textarea></label><div class="actions"><button type="button" class="secondary closeDlg">取消</button><button class="primary">新增</button></div></form></dialog>

<dialog id="taskDlg"><form id="taskForm" class="dialog"><h2>新增照護事項</h2><label>選擇事項<select id="taskSelect"></select></label><label>或自行輸入<input id="customTask" maxlength="50" placeholder="例如：擦眼睛"></label><div class="actions"><button type="button" class="secondary closeDlg">取消</button><button class="primary">加入</button></div></form></dialog>

<dialog id="waterDlg"><form id="waterForm" class="dialog"><h2>新增喝水紀錄</h2><label>貓咪<select id="waterCat" required></select></label><div class="two"><label>日期<input id="waterDate" type="date" required></label><label>時間<input id="waterTime" type="time" required></label></div><label>初始水量 (g)<input id="waterStart" type="number" min="0" step=".1" required></label><label>最終水量 (g)<input id="waterEnd" type="number" min="0" step=".1" required></label><div class="calc">喝水量 <b id="waterTotal">0.0 g</b></div><div class="actions"><button type="button" class="secondary closeDlg">取消</button><button class="primary">儲存</button></div></form></dialog>
<script src="app.js"></script>
</body></html>
